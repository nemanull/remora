---
- name: Reboot the core when an update needs it
  hosts: core
  become: true
  tasks:
    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the core
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists

    - name: Wait for the core to answer its health check
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/health
        status_code: 200
      register: core_health
      until: core_health.status == 200
      retries: 30
      delay: 5

- name: Reboot collectors one host at a time when an update needs it
  hosts: collectors
  serial: 1
  max_fail_percentage: 0
  become: true
  tasks:
    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the collector
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists

    - name: Wait until the collector holds a live core link and every assigned wallet
      ansible.builtin.uri:
        url: http://127.0.0.1:3010/health
        status_code: 200
      register: collector_health
      until: collector_health.status == 200
      retries: 24
      delay: 5
