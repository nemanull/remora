---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - chrony
      - python3-debian
      - python3-requests
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check that the inventory carries the admin key
  ansible.builtin.assert:
    that:
      - admin_ssh_public_key is defined
    fail_msg: Run make infra-apply, then make inventory, so the inventory carries the SSH key of terraform.tfvars.
    quiet: true

- name: Check that the admin key parses as an SSH public key
  ansible.builtin.command: ssh-keygen -l -f -
  args:
    stdin: "{{ admin_ssh_public_key }}"
  changed_when: false

- name: Authorize the admin key and revoke every other key
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ admin_ssh_public_key }}"
    exclusive: true
    state: present

- name: Disable password and root logins over SSH
  ansible.builtin.copy:
    src: sshd-hardening.conf
    dest: /etc/ssh/sshd_config.d/10-remora.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Install security updates without rebooting
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/apt/apt.conf.d/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 52remora-unattended-upgrades

- name: Allow incoming TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ base_ufw_allowed_tcp_ports }}"

- name: Deny every other incoming connection
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Keep chrony running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  when: ansible_facts['virtualization_type'] != 'lxc'

- name: Check that chrony tracks a time source
  ansible.builtin.command: chronyc tracking
  changed_when: false
  when: ansible_facts['virtualization_type'] != 'lxc'
