global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: server
    static_configs:
      - targets: [core:3000]

  - job_name: wallet-finder
    static_configs:
      - targets: [wallet-finder:3020]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
