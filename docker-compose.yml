name: remora

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: remora
      POSTGRES_PASSWORD: remora
      POSTGRES_DB: remora
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U remora -d remora]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.6.3
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
