name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every commit on main runs in a group of its own, so no newer push cancels it and each one gets its images.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint and typecheck read the built sdk and the generated Prisma client.
      - run: pnpm -r run build

      - run: pnpm -r run lint

      - run: pnpm -r run typecheck

      - run: pnpm -r run test

      - run: pnpm -r run test:integration

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.62.1

      - run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform
        run: |
          for root in production staging; do
            terraform -chdir=infra/terraform/$root init -backend=false -input=false
            terraform -chdir=infra/terraform/$root validate
          done

      - name: Lint Terraform
        run: |
          for root in production staging; do
            tflint --chdir=infra/terraform/$root --init
            tflint --chdir=infra/terraform/$root --format compact
          done

      - uses: ansible/ansible-lint@v26.4.0
        with:
          working_directory: infra/ansible
          requirements_file: requirements.yml

      # The runner image's ansible-core sits in a pipx home that root owns, so the pinned one gets a home of its own.
      - name: Install ansible-core
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
        run: |
          pipx install ansible-core==2.21.5
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"

      - name: Render and check the deploy templates
        run: |
          for env in production staging; do
            out="$RUNNER_TEMP/render/$env"
            (cd infra/ansible && ansible-playbook -i "inventory/$env.example.yml" render.yml -e "render_root=$out")
            for dir in "$out"/*/; do
              docker compose -f "${dir}compose.yaml" config --quiet
            done
            for caddyfile in "$out"/*/Caddyfile; do
              docker run --rm -v "$caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.3 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            done
          done

  # Pull requests build every image without publishing it, so a broken Dockerfile fails before merge.
  images:
    needs: [app, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        target: [server, wallet-finder, collector, web, hyperliquid-sim]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/remora-${{ matrix.target }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope={0}', matrix.target) || '' }}
