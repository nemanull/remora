name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint and typecheck read the built sdk and the generated Prisma client.
      - run: pnpm -r run build

      - run: pnpm -r run lint

      - run: pnpm -r run typecheck

      - run: pnpm -r run test

      - run: pnpm -r run test:integration

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.62.1

      - run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform
        run: |
          for root in production staging; do
            terraform -chdir=infra/terraform/$root init -backend=false -input=false
            terraform -chdir=infra/terraform/$root validate
          done

      - name: Lint Terraform
        run: |
          for root in production staging; do
            tflint --chdir=infra/terraform/$root --init
            tflint --chdir=infra/terraform/$root --format compact
          done

      - uses: ansible/ansible-lint@v26.4.0
        with:
          working_directory: infra/ansible
          requirements_file: requirements.yml

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [server, wallet-finder, collector, web, hyperliquid-sim]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/remora-${{ matrix.target }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
